name: "Build and deploy to CloudFlare"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "cloudflare"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Build site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: "production"
          
      - name: Cache HTMLProofer
        id: cache-htmlproofer
        uses: actions/cache@v6
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer

      - name: Test site
        run: |
          bundle exec htmlproofer _site --disable-external --ignore-urls "/^http:\/\/archives\.bassdrivearchive\.com/"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d9229409f838e8b589fd9cf96f849799
          command: pages deploy _site --project-name=blog
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
